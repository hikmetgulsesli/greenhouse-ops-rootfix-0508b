<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Operator Profile Panel</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#3c4a5e",
                        "outline": "#8d90a0",
                        "tertiary-fixed": "#ffdbcd",
                        "primary": "#b4c5ff",
                        "surface-container-low": "#191b23",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-surface": "#e1e2ed",
                        "surface-tint": "#b4c5ff",
                        "surface-dim": "#11131b",
                        "on-secondary": "#233144",
                        "on-tertiary-fixed": "#360f00",
                        "on-primary-fixed": "#00174b",
                        "secondary": "#b9c7df",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "inverse-on-surface": "#2e3039",
                        "surface-container-highest": "#32343d",
                        "on-background": "#e1e2ed",
                        "secondary-fixed-dim": "#b9c7df",
                        "on-tertiary": "#581e00",
                        "surface-variant": "#32343d",
                        "background": "#11131b",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "primary-container": "#2563eb",
                        "on-secondary-fixed-variant": "#3a485b",
                        "tertiary": "#ffb596",
                        "outline-variant": "#434655",
                        "surface": "#11131b",
                        "inverse-surface": "#e1e2ed",
                        "tertiary-fixed-dim": "#ffb596",
                        "on-tertiary-container": "#ffede6",
                        "on-surface-variant": "#c3c6d7",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed": "#d5e3fc",
                        "surface-container": "#1d1f27",
                        "error": "#ffb4ab",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-bright": "#373942",
                        "on-error": "#690005",
                        "tertiary-container": "#bc4800",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-container": "#abb9d1",
                        "inverse-primary": "#0053db",
                        "surface-container-lowest": "#0c0e16",
                        "surface-container-high": "#282a32",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-primary": "#002a78"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin": "24px",
                        "gutter": "16px",
                        "unit": "4px",
                        "sm": "8px",
                        "md": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "display": ["Inter", "sans-serif"],
                        "mono-data": ["monospace"],
                        "body-sm": ["Inter", "sans-serif"],
                        "body-xs": ["Inter", "sans-serif"],
                        "heading-md": ["Inter", "sans-serif"],
                        "label-caps": ["Inter", "sans-serif"]
                    },
                    "fontSize": {
                        "display": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "mono-data": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-xs": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "heading-md": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-sm h-screen overflow-hidden relative">
<!-- Simulated background dashboard context to show the overlay effect clearly -->
<div class="absolute inset-0 p-margin grid grid-cols-12 gap-gutter opacity-30 pointer-events-none filter blur-[2px]">
<div class="col-span-8 bg-surface border border-outline-variant rounded-xl h-96"></div>
<div class="col-span-4 bg-surface border border-outline-variant rounded-xl h-96"></div>
</div>
<!-- Overlay Backdrop -->
<div class="fixed inset-0 bg-background/80 z-40 backdrop-blur-sm flex justify-end">
<!-- Profile Panel / Side Drawer -->
<aside class="w-full max-w-[400px] h-full bg-surface-container border-l border-outline-variant shadow-2xl flex flex-col z-50 transform transition-transform translate-x-0">
<!-- Header -->
<header class="flex items-center justify-between p-margin border-b border-outline-variant bg-surface-container-high shrink-0">
<h2 class="font-heading-md text-heading-md text-on-surface">Operator Profile</h2>
<button aria-label="Close Profile Panel" class="p-xs text-on-surface-variant hover:text-on-surface hover:bg-surface-variant rounded-xl transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-high">
<span class="material-symbols-outlined block" data-icon="close">close</span>
</button>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto">
<!-- Identity Section -->
<section class="p-margin flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full bg-surface-variant mb-md overflow-hidden ring-2 ring-outline-variant relative">
<img alt="Operator Avatar" class="w-full h-full object-cover" data-alt="A professional headshot of a male greenhouse sector manager in his mid-30s. He is wearing a dark, functional corporate uniform suitable for technical agricultural work. The lighting is cool and clinical, reflecting the minimal, high-stakes environment of a modern, data-intensive greenhouse control room. The dark background emphasizes the stark, high-tech industrial setting of the corporate minimalism aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkup4iZ3R7eGkBB2fRNgkaCVTq2VvjoOzRMpIN6hC4-2UaYlUlJQCzRI6boCiCSYvamUN7lPD19uOcn-VYZbFQ0sZRoTITxf2mSlQNwcFQGtqXqQe0V9fuMLZcL_yyv2RLuTeIG0uVerCVVWY50YOCYDUrKqAz7q7da-sSHFklbT20pJFRNZoII30N7EpekEzWDcOSMjQBH0eODAHjl4f3pblyxniZp9neaK1uLdnv3n4j10RGa56VKJxc2gNJYw1tg7F-1k8JCNjX"/>
</div>
<h3 class="font-heading-md text-heading-md text-on-surface mb-unit">Dr. Elias Thorne</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm">Sector Manager</p>
<div class="px-sm py-xs bg-secondary-container rounded-DEFAULT inline-flex items-center gap-xs text-on-secondary-container border border-outline-variant/30">
<span class="material-symbols-outlined text-[14px]" data-icon="badge">badge</span>
<span class="font-mono-data text-mono-data">ID: OP-7724</span>
</div>
</section>
<hr class="border-t border-outline-variant mx-margin"/>
<!-- Settings / Toggles Section -->
<section class="p-margin space-y-md">
<h4 class="font-label-caps text-label-caps text-primary uppercase tracking-widest">Notification Preferences</h4>
<div class="space-y-sm">
<!-- Toggle Item: System Alerts -->
<div class="flex items-center justify-between p-md bg-surface rounded-xl border border-outline-variant hover:bg-surface-container-highest transition-colors cursor-pointer">
<div class="pr-sm">
<p class="font-body-sm text-body-sm text-on-surface font-medium mb-unit">System Alerts</p>
<p class="font-body-xs text-body-xs text-on-surface-variant">Immediate push for critical environment failures</p>
</div>
<!-- Active Toggle -->
<button aria-checked="true" class="w-10 h-6 rounded-full bg-primary relative shrink-0 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" role="switch">
<div class="w-4 h-4 bg-on-primary rounded-full absolute right-1 top-1 shadow-sm transition-transform"></div>
</button>
</div>
<!-- Toggle Item: Maintenance Updates -->
<div class="flex items-center justify-between p-md bg-surface rounded-xl border border-outline-variant hover:bg-surface-container-highest transition-colors cursor-pointer">
<div class="pr-sm">
<p class="font-body-sm text-body-sm text-on-surface font-medium mb-unit">Maintenance Reminders</p>
<p class="font-body-xs text-body-xs text-on-surface-variant">Scheduled equipment downtime and service logs</p>
</div>
<!-- Inactive Toggle -->
<button aria-checked="false" class="w-10 h-6 rounded-full bg-surface-variant border border-outline relative shrink-0 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" role="switch">
<div class="w-4 h-4 bg-outline rounded-full absolute left-1 top-1 transition-transform"></div>
</button>
</div>
<!-- Toggle Item: Shift Summaries -->
<div class="flex items-center justify-between p-md bg-surface rounded-xl border border-outline-variant hover:bg-surface-container-highest transition-colors cursor-pointer">
<div class="pr-sm">
<p class="font-body-sm text-body-sm text-on-surface font-medium mb-unit">Shift Updates</p>
<p class="font-body-xs text-body-xs text-on-surface-variant">Automated digests at shift handover</p>
</div>
<!-- Active Toggle -->
<button aria-checked="true" class="w-10 h-6 rounded-full bg-primary relative shrink-0 transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface" role="switch">
<div class="w-4 h-4 bg-on-primary rounded-full absolute right-1 top-1 shadow-sm transition-transform"></div>
</button>
</div>
</div>
</section>
</div>
<!-- Footer / Action Area -->
<footer class="p-margin border-t border-outline-variant bg-surface-container-high shrink-0 mt-auto">
<button class="w-full py-md px-margin flex items-center justify-center gap-sm rounded-xl border border-error text-error hover:bg-error-container hover:text-on-error-container transition-colors focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-surface-container-high">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
<span class="font-body-sm text-body-sm font-medium">Terminate Session</span>
</button>
</footer>
</aside>
</div>
</body></html>
